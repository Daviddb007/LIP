{% extends "base.html" %}

{% block title %}API Pública — Swagger UI{% endblock %}

{% block content %}
<section class="hero" style="padding: var(--space-3xl) 0; padding-bottom: var(--space-2xl);">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-8">
                <div class="badge badge-primary mb-3">API Pública · OpenAPI 3.0</div>
                <h1 class="display-lg text-white mb-3">Swagger UI</h1>
                <p class="body-lg text-white-50" style="max-width: 600px;">
                    Interfaz interactiva de la API REST del Ecosistema Nacional de Inteligencia Pública
                </p>
            </div>
            <div class="col-lg-4 text-lg-end mt-3 mt-lg-0">
                <a href="{{ url_for('api_v1.api_openapi') }}" class="btn btn-outline-light btn-sm" target="_blank">
                    <i class="bi bi-file-earmark-code me-1"></i>openapi.json
                </a>
            </div>
        </div>
    </div>
</section>

<section class="section" style="padding-top: 0;">
    <div class="container">
        <div class="card-elevated">
            <div id="swagger-ui" style="min-height: 600px;"></div>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
window.onload = function() {
    window.ui = SwaggerUIBundle({
        url: '/api/v1/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis],
        persistAuthorization: true,
    });
};
</script>
{% endblock %}
