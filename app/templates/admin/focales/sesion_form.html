{% extends "base.html" %}
{% block title %}Nueva sesión — Grupos Focales{% endblock %}
{% block content %}
<section class="section" style="padding: var(--space-2xl) 0 var(--space-xl); background: var(--bg-1);">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="heading-xl text-dark mb-1">Nueva sesión</h1>
                <p class="body-sm text-muted-2">Grupo focal con una organización</p>
            </div>
            <a href="{{ url_for('focales.sesiones') }}" class="btn btn-outline"><i class="bi bi-arrow-left me-2"></i>Volver</a>
        </div>
    </div>
</section>
<section class="section" style="padding-top: 0;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card-elevated p-4">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label">Organización *</label>
                            <select name="org_id" class="form-select" required>
                                <option value="">— Seleccione —</option>
                                {% for o in orgs %}
                                <option value="{{ o.id }}" {{ 'selected' if org_id == o.id }}>{{ o.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Fecha *</label>
                                <input type="date" name="fecha" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Modalidad</label>
                                <select name="modalidad" class="form-select">
                                    {% for value, label in [('presencial','Presencial'),('virtual','Virtual'),('hibrida','Híbrida')] %}
                                    <option value="{{ value }}">{{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="mb-3 mt-3">
                            <label class="form-label">Título</label>
                            <input type="text" name="titulo" class="form-control" placeholder="Sesión con {org} — problemática {sector}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Lugar</label>
                            <input type="text" name="lugar" class="form-control" placeholder="Sala / plataforma">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Objetivo</label>
                            <textarea name="objetivo" class="form-control" rows="3" placeholder="Objetivo de la sesión..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Estado inicial</label>
                            <select name="estado" class="form-select">
                                {% for value, label in [('programada','Programada'),('en_curso','En curso'),('finalizada','Finalizada')] %}
                                <option value="{{ value }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-2"></i>Crear sesión</button>
                            <a href="{{ url_for('focales.sesiones') }}" class="btn btn-outline">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
